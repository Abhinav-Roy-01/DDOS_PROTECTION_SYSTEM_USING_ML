[tool.poetry]
name = "dns-shield"
version = "0.1.0"
description = "DNS Filtering Service with ML-based threat detection"
authors = ["Your Name"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
dnspython = "^2.6.1"
aioquic = "^1.2.0"
scikit-learn = "^1.5.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
redis = "^5.0.0"
asyncpg = "^0.29.0"
httpx = "^0.27.0"
cabby = "^0.1.23"
stix2 = "^3.0.1"
scapy = "^2.5.0"
pyshark = "^0.6.0"
joblib = "^1.4.0"
cryptography = "^42.0.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
structlog = "^24.2.0"
prometheus-client = "^0.20.0"
python-dotenv = "^1.0.0"
flask = "^2.3.0"
flask-cors = "^4.0.1"
gunicorn = "^22.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
locust = "^2.29.0"
black = "^24.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

events { worker_connections 4096; }
http {
  upstream api         { server api:8000; }
  upstream dashboard   { server dashboard:3001; }
  upstream http_shield { server http-layer-shield:8080; }
  server {
    listen 80;
    location /api          { proxy_pass http://api; }
    location /dns-query    { proxy_pass http://doh-server:443; }
    location /shield       { proxy_pass http://http_shield; }
    location /             { proxy_pass http://dashboard; }
  }
}

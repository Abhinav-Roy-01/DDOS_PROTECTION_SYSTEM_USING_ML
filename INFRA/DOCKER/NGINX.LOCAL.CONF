worker_processes 1;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=PER_IP:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ADMIN_PER_IP:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=CONN_PER_IP:10m;

    upstream ddos_app {
        server app:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_tokens off;

        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_timeout 15s;
        client_max_body_size 64k;

        limit_conn CONN_PER_IP 50;
        limit_conn_status 429;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            limit_req zone=ADMIN_PER_IP burst=10 nodelay;
            proxy_pass http://ddos_app;
        }

        location / {
            limit_req zone=PER_IP burst=40 nodelay;
            proxy_pass http://ddos_app;
        }
    }
}
